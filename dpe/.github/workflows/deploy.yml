name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Run Unit Tests (DOB-27)
  test:
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  # 2. Deploy Application (DOB-23)
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --build-secret GITHUB_TOKEN=${{ secrets.GH_PAT }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
