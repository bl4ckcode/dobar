worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $uri $safe_uri {
        ~^/convite/ /convite/[REDACTED];
        default $uri;
    }
    log_format dobar_safe '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $safe_uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log dobar_safe;

    server {
        listen 80;
        
        # Determine root directory
        root /usr/share/nginx/html;
        index index.html;

        location = /.well-known/apple-app-site-association {
            default_type application/json;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }
        location = /.well-known/assetlinks.json {
            default_type application/json;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        # 1. Disable cache for index.html, bootstrapping scripts, and service worker/manifest
        # This ensures the browser always checks for a new version of the app entry point.
        location ~* ^/(index\.html|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # 2. Cache other static assets (images, fonts, hashed main.dart.js)
        # Flutter appends hashes to most assets, so we can cache them aggressively.
        location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # 3. Handle SPA Routing
        # Redirect all non-file requests to index.html so Flutter Router handles the path.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
