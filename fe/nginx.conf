worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        
        # Determine root directory
        root /usr/share/nginx/html;
        index index.html;

        # 1. Disable cache for index.html, bootstrapping scripts, and service worker/manifest
        # This ensures the browser always checks for a new version of the app entry point.
        location ~* ^/(index\.html|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # 2. Cache other static assets (images, fonts, hashed main.dart.js)
        # Flutter appends hashes to most assets, so we can cache them aggressively.
        location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # 3. Handle SPA Routing
        # Redirect all non-file requests to index.html so Flutter Router handles the path.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
