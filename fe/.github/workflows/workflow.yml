name: BarZ CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest] # Include both Linux and macOS runners
    runs-on: ${{ matrix.platform }}

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Install Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      # Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Run code generation
      - name: Generate Code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # Update CocoaPods repositories (only on macOS)
      - name: Update CocoaPods Repos
        if: ${{ matrix.platform == 'macos-latest' }}
        run: pod repo update

      # Build APK (Android) - Only on Ubuntu
      - name: Build APK (Android)
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: flutter build apk --debug

      # Build iOS (Debug) - Only on macOS
      - name: Build iOS (Debug)
        if: ${{ matrix.platform == 'macos-latest' }}
        run: flutter build ios --debug --no-codesign

      # Static code analysis
      - name: Analyze Code
        run: flutter analyze

      # Check code formatting
      - name: Check Formatting
        run: flutter format --set-exit-if-changed .
