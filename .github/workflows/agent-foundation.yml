name: Agent Workflow Foundation

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '20 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Specs, skills, and workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow dependencies
        id: dependencies
        run: python -m pip install -r tools/agent_workflow/requirements.txt
      - name: Validate canonical context and MVP coverage
        id: validate
        run: python -m tools.agent_workflow validate
      - name: Validate platform specifications
        id: platform_specs
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m tools.agent_workflow --catalog platform validate
      - name: Test workflow tooling
        id: tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m unittest discover -s tools/agent_workflow/tests -v
      - name: Install isolated wire-contract dependencies
        id: contract_dependencies
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pip install -r tools/agent_workflow/contract_tests/requirements.txt
      - name: Test shared checkout wire contract
        id: checkout_contracts
        if: ${{ !cancelled() && steps.contract_dependencies.outcome == 'success' }}
        run: python -m unittest discover -s tools/agent_workflow/contract_tests -v
      - name: Report actual outcomes
        if: always()
        env:
          VALIDATE_RESULT: ${{ steps.validate.outcome }}
          PLATFORM_SPECS_RESULT: ${{ steps.platform_specs.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          CHECKOUT_CONTRACTS_RESULT: ${{ steps.checkout_contracts.outcome }}
          JOB_RESULT: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo '## Agent foundation checks'
            echo "- Event: $EVENT_NAME"
            echo "- Context/coverage validation: $VALIDATE_RESULT"
            echo "- Platform specification validation: $PLATFORM_SPECS_RESULT"
            echo "- Workflow tests: $TEST_RESULT"
            echo "- Shared Pix wire contracts: $CHECKOUT_CONTRACTS_RESULT"
            echo "- Job outcome before report: $JOB_RESULT"
            echo '- Provider sandbox: skipped (separate configured execution required)'
            echo '- Product E2E and native-device validation: skipped (follow-on work)'
            echo '- Scheduled context scans are deterministic and read-only; semantic contradictions remain findings for review.'
          } >> "$GITHUB_STEP_SUMMARY"
