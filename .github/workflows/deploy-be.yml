name: Deploy BE to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'be/**'
      - '.github/workflows/deploy-be.yml'
      - '.github/workflows/be-unit-tests.yml'
      - '.github/workflows/payment-contract-validation.yml'
      - '.github/workflows/run-migrations.yml'

jobs:
  # 1. Run Unit Tests
  test:
    uses: ./.github/workflows/be-unit-tests.yml
    secrets: inherit

  # 2. Validate Payment Contracts
  contracts:
    needs: test
    uses: ./.github/workflows/payment-contract-validation.yml
    secrets: inherit

  # 3. Deploy Application
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [test, contracts]
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: latest
      
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config fly.toml --build-secret GITHUB_TOKEN=${{ secrets.GH_PAT_WRITE_ACCESS }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # 4. Check for Pending Migrations
  check_migrations:
    name: Check Pending Migrations
    runs-on: ubuntu-latest
    needs: deploy
    defaults:
      run:
        working-directory: be
    outputs:
      should_migrate: ${{ steps.check.outputs.should_migrate }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for migration files
        id: check
        run: |
          # If migration files exist in the folder, we need to migrate.
          # Migration files are always kept in the repo (applied migrations
          # are never deleted), so this gate always returns should_migrate=true.
          # This is safe: `alembic upgrade head` is idempotent and is a fast
          # no-op when the database is already at head.
          
          if ls migrations/versions/*.py 1> /dev/null 2>&1; then
            echo "🔄 Found pending migration files."
            echo "should_migrate=true" >> $GITHUB_OUTPUT
          else
            echo "✨ No migration files found. Database is up to date."
            echo "should_migrate=false" >> $GITHUB_OUTPUT
          fi

  # 5. Run Migrations (Conditional)
  migrations:
    needs: check_migrations
    if: needs.check_migrations.outputs.should_migrate == 'true'
    uses: ./.github/workflows/run-migrations.yml
    secrets: inherit
