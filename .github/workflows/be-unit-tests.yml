name: Run Unit Tests

on:
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: be/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install git+https://${{ secrets.GH_PAT_WRITE_ACCESS }}@github.com/bl4ckcode/dobar-payment-engine.git
      
      - name: Run tests
        run: pytest tests/ --no-cov -q
        env:
          DATABASE_URL: sqlite:///./test.db
          MONGO_URI: mongodb://localhost:27017/test
          SECRET_KEY: test_secret_key
          FIREBASE_CREDENTIALS_JSON: '{"type": "service_account", "project_id": "test"}'
          TESTING: "true"
          REDIS_URL: "memory://"
