name: Live Rate-Card Check

# Verifies GET /advertising/rates against the running production deployment with
# scripts/verify_rate_card_live.py (exit 0 = contract holds, 1 = drift).
#
# Preferred mode runs the script INSIDE the app container via `flyctl ssh console`:
# the token mint falls back to the machine's own $SECRET_KEY, so GitHub never stores
# an app secret and the signing key never leaves Fly. The contract is checked twice —
# against the container's own http://127.0.0.1:8080 (app process) and against the
# public https://…fly.dev edge (TLS + Fly proxy).
#
# A "mint on the runner" fallback engages only when the in-container mode fails and
# needs the optional BARZ_JWT_SECRET repo secret.
#
# Triggers:
#   - workflow_dispatch: manual run from the Actions tab
#   - workflow_call:     post-deploy gate, e.g.
#                           verify_rate_card:
#                             needs: deploy
#                             uses: ./.github/workflows/rate-card-live.yml

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Principal minted into the token (must hold ads:view on bar_id)"
        required: false
        default: "6"
      bar_id:
        description: "Bar to query"
        required: false
        default: "16"
  workflow_call:
    inputs:
      user_id:
        description: "Principal minted into the token (must hold ads:view on bar_id)"
        required: false
        default: "6"
        type: number
      bar_id:
        description: "Bar to query"
        required: false
        default: "16"
        type: number

jobs:
  verify:
    name: Verify production rate card
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    env:
      # keep in sync with `app =` in fly.toml
      FLY_APP: barz-backend-bold-sun-5691
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install script dependencies
        run: |
          python -m pip install --upgrade pip
          # only what the verifier imports (httpx at module level, PyJWT inside mint_token),
          # pinned by the same requirements.txt the app ships with
          grep -E '^(httpx|PyJWT)' requirements.txt | xargs pip install

      - name: Self-test the verifier offline
        run: python scripts/verify_rate_card_live.py --self-test

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify inside the app container (no app secret needed)
        id: in_container
        continue-on-error: true
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN repo secret is not set — cannot open flyctl ssh."
            exit 1
          fi
          # flyctl's -C execs WITHOUT a shell: absolute paths, chained via `sh -c`.
          # Run 1 hits the container's own :8080 (app process), run 2 the public edge
          # (TLS + Fly proxy). The mint falls back to the machine's own $SECRET_KEY,
          # so no app secret ever exists in GitHub.
          flyctl ssh console -a "$FLY_APP" -C \
            'sh -c "python /app/scripts/verify_rate_card_live.py --base-url http://127.0.0.1:8080 --user-id ${{ inputs.user_id }} --bar-id ${{ inputs.bar_id }} && python /app/scripts/verify_rate_card_live.py --user-id ${{ inputs.user_id }} --bar-id ${{ inputs.bar_id }}"'

      - name: Fallback — mint on the runner (needs BARZ_JWT_SECRET)
        id: runner_mint
        if: steps.in_container.outcome != 'success'
        env:
          BARZ_JWT_SECRET: ${{ secrets.BARZ_JWT_SECRET }}
        run: |
          if [ -z "$BARZ_JWT_SECRET" ]; then
            echo "::error::In-container verification failed and BARZ_JWT_SECRET is not set."
            echo "Fix one of the two:"
            echo "  1) Make FLY_API_TOKEN an org/member Fly API token — deploy-only tokens cannot run 'flyctl ssh console'."
            echo "  2) Settings -> Secrets and variables -> Actions: add BARZ_JWT_SECRET (the app's SECRET_KEY) so the runner can mint."
            exit 1
          fi
          python scripts/verify_rate_card_live.py \
            --user-id "${{ inputs.user_id }}" \
            --bar-id "${{ inputs.bar_id }}"
