name: Run Unit Tests

on:
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dpe
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: dpe/pyproject.toml
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[api,dev]"
      
      - name: Run tests
        run: pytest tests/ --no-cov -q
        env:
          DPE_SERVICE_SECRET: 'test_secret'
          TESTING: "true"
          REDIS_URL: "memory://"
