name: Deploy FE to Fly.io

on:
  workflow_call:

jobs:
  test:
    uses: ./.github/workflows/fe-unit-tests.yml
    secrets: inherit

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
      
      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web App
        run: flutter build web --release --no-tree-shake-icons --dart-define=PAGARME_PUBLIC_KEY="$PAGARME_PUBLIC_KEY"
        env:
          PAGARME_PUBLIC_KEY: ${{ vars.PAGARME_PUBLIC_KEY || secrets.PAGARME_PUBLIC_KEY }}

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_FE_TOKEN }}
