name: Payment Contract Validation

on:
  workflow_call:
    outputs:
      validation_status:
        description: "Deterministic contract-check outcome: passed, failed, skipped, or cancelled; excludes provider/native E2E"
        value: ${{ jobs.validate_contracts.outputs.status }}

permissions:
  contents: read

jobs:
  validate_contracts:
    name: Validate Payment & Wallet Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    outputs:
      status: ${{ steps.final_status.outputs.status }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            be/requirements.txt
            be/requirements-test.txt
            dpe/pyproject.toml
      - name: Install dependencies from this checkout
        id: dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install -e "../dpe[all]"
      - name: Run shared checkout contracts from the same FE/BE/DPE checkout
        id: checkout_contracts
        run: |
          cd ..
          python -m unittest discover -s tools/agent_workflow/contract_tests -v
      - name: Run payment model schema validation
        id: payment_schemas
        run: python tests/contract_validation/validate_payment_schemas.py
        env:
          DATABASE_URL: sqlite:///./test.db
      - name: Run legacy BE client signature checks
        id: client_signatures
        run: python tests/contract_validation/validate_dpe_contracts.py
        env:
          DATABASE_URL: sqlite:///./test.db
      - name: Run wallet contract tests
        id: wallet
        run: pytest tests/contract_validation/test_wallet_contracts.py -v --tb=short
        env:
          DATABASE_URL: sqlite:///./test.db
          MONGO_URI: mongodb://localhost:27017/test
          SECRET_KEY: test_secret_key
          FIREBASE_CREDENTIALS_JSON: '{"type": "service_account", "project_id": "test"}'
      - name: Run legacy external-client structure checks (no live provider calls)
        id: external_structure
        run: python tests/contract_validation/validate_external_apis.py
      - name: Set and report actual deterministic check outcome
        id: final_status
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          CHECKOUT_CONTRACTS_RESULT: ${{ steps.checkout_contracts.outcome }}
          PAYMENT_SCHEMAS_RESULT: ${{ steps.payment_schemas.outcome }}
          CLIENT_SIGNATURES_RESULT: ${{ steps.client_signatures.outcome }}
          WALLET_RESULT: ${{ steps.wallet.outcome }}
          EXTERNAL_STRUCTURE_RESULT: ${{ steps.external_structure.outcome }}
        run: |
          python - <<'PYTHON'
          import os

          checks = {
              "Dependencies (local BE/DPE checkout)": os.environ["DEPENDENCIES_RESULT"],
              "Shared Pix fixture: BE/DPE wire contracts (Flutter checked separately)": os.environ["CHECKOUT_CONTRACTS_RESULT"],
              "Payment model schemas": os.environ["PAYMENT_SCHEMAS_RESULT"],
              "Legacy BE client signatures": os.environ["CLIENT_SIGNATURES_RESULT"],
              "Wallet contracts": os.environ["WALLET_RESULT"],
              "Legacy external-client structure (not availability)": os.environ["EXTERNAL_STRUCTURE_RESULT"],
          }
          outcomes = list(checks.values())
          if os.environ["JOB_RESULT"] == "cancelled" or "cancelled" in outcomes:
              status = "cancelled"
          elif os.environ["JOB_RESULT"] == "failure" or "failure" in outcomes:
              status = "failed"
          elif outcomes and all(outcome == "success" for outcome in outcomes):
              status = "passed"
          else:
              status = "skipped"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"status={status}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Payment contract checks\n\n")
              for name, outcome in checks.items():
                  summary.write(f"- {name}: {outcome or 'skipped'}\n")
              summary.write(f"\nDeterministic result: **{status}**\n\n")
              summary.write("- Provider sandbox/availability: skipped (not exercised by legacy structure checks)\n")
              summary.write("- Native wallets and product E2E: skipped (separate device/provider evidence required)\n")
          PYTHON
