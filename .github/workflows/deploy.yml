name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - 'dpe/**'
      - 'be/**'
      - 'fe/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed deployment targets
    runs-on: ubuntu-latest
    outputs:
      dpe: ${{ steps.detect.outputs.dpe }}
      be: ${{ steps.detect.outputs.be }}
      fe: ${{ steps.detect.outputs.fe }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - name: Compare each target with its last deployed commit
        id: detect
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          def rev(ref):
              r = subprocess.run(
                  ["git", "rev-parse", "-q", "--verify", f"{ref}^{{commit}}"],
                  capture_output=True, text=True,
              )
              return r.stdout.strip() or None

          empty = subprocess.check_output(
              ["git", "hash-object", "-t", "tree", "--stdin"], input=b""
          ).decode().strip()
          event_before = os.environ.get("EVENT_BEFORE", "")
          # No tag yet: fall back to the pushed range. Manual runs and new
          # branches have no usable "before", so everything counts as changed.
          fallback = event_before if rev(event_before) else empty

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for area in ("dpe", "be", "fe"):
                  base = rev(f"refs/tags/deployed/{area}") or fallback
                  diff = subprocess.check_output([
                      "git", "diff", "--no-renames", "--name-only", "-z",
                      base, os.environ["GITHUB_SHA"], "--", f"{area}/",
                  ]).split(b"\0")
                  changed = any(diff)
                  print(f"{area}: base={base} changed={changed}")
                  output.write(f"{area}={str(changed).lower()}\n")
          PY

  dpe:
    name: DPE
    needs: changes
    if: needs.changes.outputs.dpe == 'true'
    uses: ./.github/workflows/deploy-dpe.yml
    secrets: inherit

  be:
    name: Backend and migrations
    needs: [changes, dpe]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.be == 'true' &&
      (needs.dpe.result == 'success' || needs.dpe.result == 'skipped')
    uses: ./.github/workflows/deploy-be.yml
    secrets: inherit

  fe:
    name: Frontend
    needs: [changes, dpe, be]
    if: >-
      always() && !cancelled() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.fe == 'true' &&
      (needs.dpe.result == 'success' || needs.dpe.result == 'skipped') &&
      (needs.be.result == 'success' || needs.be.result == 'skipped')
    uses: ./.github/workflows/deploy-fe.yml
    secrets: inherit

  mark-dpe:
    name: Mark dpe deployed
    needs: dpe
    if: needs.dpe.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag -f deployed/dpe "$GITHUB_SHA"
          git push -f origin refs/tags/deployed/dpe

  mark-be:
    name: Mark be deployed
    needs: be
    if: needs.be.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag -f deployed/be "$GITHUB_SHA"
          git push -f origin refs/tags/deployed/be

  mark-fe:
    name: Mark fe deployed
    needs: fe
    if: needs.fe.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag -f deployed/fe "$GITHUB_SHA"
          git push -f origin refs/tags/deployed/fe
