[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

markers =
    auth: Authentication tests
    bars: Bar and restaurant tests
    menus: Menu tests
    orders: Order tests
    payment: Payment tests
    integration: Integration tests
    unit: Unit tests
