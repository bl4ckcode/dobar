[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --ignore=tests/test_paypal_sandbox.py
    --ignore=tests/test_stone_sandbox.py
    --ignore=tests/test_stripe_sandbox.py
    --ignore=tests/test_orders_enhanced.py
    --ignore=tests/test_wallet.py
    --ignore=tests/test_payment.py

markers =
    auth: Authentication tests
    bars: Bar and restaurant tests
    menus: Menu tests
    orders: Order tests
    payment: Payment tests
    integration: Integration tests
    unit: Unit tests
