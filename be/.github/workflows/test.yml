name: Run Tests on PR

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install git+https://${{ secrets.GH_PAT }}@github.com/bl4ckcode/dobar-payment-engine.git
      
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: sqlite:///./test.db
          MONGO_URI: mongodb://localhost:27017/test
          SECRET_KEY: test_secret_key
          FIREBASE_CREDENTIALS_JSON: '{"type": "service_account", "project_id": "test"}'
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Run wallet and cart enhancement tests
        run: |
          pytest tests/test_bar_wallet_and_cart_enhancements.py -v
        env:
          DATABASE_URL: sqlite:///./test.db
          MONGO_URI: mongodb://localhost:27017/test
          SECRET_KEY: test_secret_key
          FIREBASE_CREDENTIALS_JSON: '{"type": "service_account", "project_id": "test"}'
      
      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "See detailed coverage in the artifacts" >> $GITHUB_STEP_SUMMARY
