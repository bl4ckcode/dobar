name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Run database migrations after deploy'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
          - 'dry-run'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install git+https://${{ secrets.GH_PAT }}@github.com/bl4ckcode/dobar-payment-engine.git
      
      - name: Run tests
        run: pytest tests/ --no-cov -q
        env:
          DATABASE_URL: sqlite:///./test.db
          MONGO_URI: mongodb://localhost:27017/test
          SECRET_KEY: test_secret_key
          FIREBASE_CREDENTIALS_JSON: '{"type": "service_account", "project_id": "test"}'

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    outputs:
      should_migrate: ${{ steps.check_migrate.outputs.should_migrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Check if migrations should run
        id: check_migrate
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          MANUAL_TRIGGER="${{ github.event.inputs.run_migrations }}"
          
          # Check for [migrate] flag in commit message
          if [[ "$COMMIT_MSG" == *"[migrate]"* ]]; then
            echo "🔄 Found [migrate] flag in commit message"
            echo "should_migrate=true" >> $GITHUB_OUTPUT
          # Check for manual trigger
          elif [[ "$MANUAL_TRIGGER" == "true" ]]; then
            echo "🔄 Manual migration trigger"
            echo "should_migrate=true" >> $GITHUB_OUTPUT
          elif [[ "$MANUAL_TRIGGER" == "dry-run" ]]; then
            echo "🔍 Dry-run migration trigger"
            echo "should_migrate=dry-run" >> $GITHUB_OUTPUT
          else
            echo "⏭️ No migration flag found, skipping migrations"
            echo "should_migrate=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --build-secret GITHUB_TOKEN=${{ secrets.GH_PAT }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  run_migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.should_migrate == 'true' || needs.deploy.outputs.should_migrate == 'dry-run'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check current migration status
        run: |
          echo "📊 Current database migration status:"
          flyctl ssh console -a barz-backend-bold-sun-5691 -C "alembic current" || echo "⚠️ Could not check status"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Show pending migrations (dry-run)
        if: needs.deploy.outputs.should_migrate == 'dry-run'
        run: |
          echo "🔍 DRY-RUN: Showing migration history..."
          flyctl ssh console -a barz-backend-bold-sun-5691 -C "alembic history --verbose" || true
          echo "⚠️ Dry-run complete. No migrations were applied."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Run migrations
        if: needs.deploy.outputs.should_migrate == 'true'
        run: |
          echo "🚀 Running database migrations..."
          flyctl ssh console -a barz-backend-bold-sun-5691 -C "alembic upgrade head"
          echo "✅ Migrations completed successfully"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 5

      - name: Verify migration status
        if: needs.deploy.outputs.should_migrate == 'true'
        run: |
          echo "🔍 Final migration status:"
          flyctl ssh console -a barz-backend-bold-sun-5691 -C "alembic current"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}