name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install git+https://${{ secrets.GH_PAT }}@github.com/bl4ckcode/dobar-payment-engine.git
      
      - name: Run tests
        run: pytest tests/ --no-cov -q
        env:
          DATABASE_URL: sqlite:///./test.db
          MONGO_URI: mongodb://localhost:27017/test
          SECRET_KEY: test_secret_key
          FIREBASE_CREDENTIALS_JSON: '{"type": "service_account", "project_id": "test"}'

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --build-secret GITHUB_TOKEN=${{ secrets.GH_PAT }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
