name: Run Unit Tests

on:
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install git+https://${{ secrets.GH_PAT_WRITE_ACCESS }}@github.com/bl4ckcode/dobar-payment-engine.git
      
      - name: Run tests
        run: pytest tests/ --no-cov -q
        env:
          DATABASE_URL: sqlite:///./test.db
          MONGO_URI: mongodb://localhost:27017/test
          SECRET_KEY: test_secret_key
          FIREBASE_CREDENTIALS_JSON: '{"type": "service_account", "project_id": "test"}'
          TESTING: "true"
          REDIS_URL: "memory://"

      - name: Dependabot Alert CSV Export
        uses: ShamKarthikS-Hexaware/dependabot-alert-export@v1.0
        with:
          GITHUB_TOKEN: ${{secrets.GH_PAT_WRITE_ACCESS}}
          org_name: 'bl4ckcode'
          repo_name: 'barz-backend'
          csv_path: data/vulnerability.csv

      - name: Upload Vulnerability report
        uses: actions/upload-artifact@v3
        with:
          name: vulnerability_report
          path: data/vulnerability.csv          
