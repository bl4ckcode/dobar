name: Run Database Migrations

on:
  workflow_call:

jobs:
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check current migration status
        run: |
          echo "📊 Current database migration status:"
          flyctl ssh console -a barz-backend-bold-sun-5691 -C "alembic current" || echo "⚠️ Could not check status"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Run migrations
        run: |
          echo "🚀 Running database migrations..."
          flyctl ssh console -a barz-backend-bold-sun-5691 -C "alembic upgrade head"
          echo "✅ Migrations completed successfully"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 5

      - name: Verify migration status
        run: |
          echo "🔍 Final migration status:"
          flyctl ssh console -a barz-backend-bold-sun-5691 -C "alembic current"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Delete applied migrations from repo
        run: |
          echo "🧹 Cleaning up applied migration files..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Checkout main branch to push changes
          git checkout main
          git pull origin main
          
          # Delete all python files in versions folder
          git rm migrations/versions/*.py || echo "No migration files to delete"
          
          # Commit and push if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: remove applied migrations [skip ci]"
            git push "https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git" main
            echo "✅ Deleted applied migrations from repository"
          fi
